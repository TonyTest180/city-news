<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>City-News — новости города</title>
<style>
:root{--bg:#f5f7fa;--cd:#fff;--tx:#141a24;--mu:#667085;--ac:#2f6bff;--a2:#00c2a8;--bd:#e3e7ee;--sh:0 10px 34px rgba(20,26,36,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1118;--cd:#161c27;--tx:#eef1f6;--mu:#93a0b4;--bd:#252d3b;--sh:0 10px 34px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0d1118;--cd:#161c27;--tx:#eef1f6;--mu:#93a0b4;--bd:#252d3b;--sh:0 10px 34px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.15;margin:.3em 0}h2{margin:1.2em 0 .5em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.hi{max-width:1080px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em}.logo b{color:var(--ac)}.logo svg{transition:transform .5s}.logo:hover svg{transform:rotate(-8deg) scale(1.1)}
nav{display:flex;gap:4px;margin-right:auto}nav a{padding:6px 14px;border-radius:99px;color:var(--mu);transition:.25s}nav a:hover{color:var(--tx);background:var(--cd)}nav a.on{background:var(--ac);color:#fff}
#auth{display:flex;align-items:center;gap:10px}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 20px;font:inherit;font-weight:600;cursor:pointer;transition:.25s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(47,107,255,.35)}.btn.w{width:100%}
.ghost,.dg,.act button,.rx button{background:none;border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font:inherit;color:var(--tx);cursor:pointer;transition:.2s}.ghost:hover,.act button:hover,.rx button:hover{border-color:var(--ac);color:var(--ac)}.dg{color:#e5484d}.dg:hover{background:#e5484d;color:#fff;border-color:#e5484d}
.mu{color:var(--mu)}main{min-height:70vh;animation:up .45s both}.w{max-width:1080px;margin:auto;padding:28px 20px}
.hero{position:relative;overflow:hidden;text-align:center;padding:88px 20px 70px}.hero p{max-width:600px;margin:0 auto 26px;color:var(--mu);font-size:1.1rem}.hero>*{position:relative}
.gr{background:linear-gradient(90deg,var(--ac),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.blob{position:absolute!important;width:460px;height:460px;left:50%;top:-140px;margin-left:-230px;border-radius:50%;background:radial-gradient(circle,rgba(47,107,255,.25),rgba(0,194,168,.12) 60%,transparent 70%);animation:fl 8s ease-in-out infinite}
.f3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.f3 div{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:20px;transition:.3s}.f3 div:hover{transform:translateY(-4px);box-shadow:var(--sh)}.f3 span{font-size:1.6rem}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;width:100%;margin:5px 0;outline:0;transition:.2s}select{width:auto}select:focus,input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-top:16px}
.card{display:block;background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:22px;transition:.3s;animation:up .55s both}.card:hover{transform:translateY(-6px);box-shadow:var(--sh);border-color:var(--ac)}.card h3{margin:.5em 0 .3em;font-size:1.2rem}.card p{color:var(--mu);margin:0 0 12px}
.tag{display:inline-block;background:rgba(47,107,255,.12);color:var(--ac);border-radius:99px;padding:2px 12px;font-size:.8rem;font-weight:600}.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mu);gap:8px;flex-wrap:wrap}
.art{max-width:760px}.body{white-space:pre-line;font-size:1.08rem;margin:20px 0}.rx{display:flex;gap:10px}.rx button{font-size:1rem;padding:8px 18px}.rx .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.rb{display:flex;gap:8px;margin:8px 0}.rb .btn{white-space:nowrap}.hide{display:none}
.cm{margin:14px 0;padding-left:14px;border-left:2px solid var(--bd);animation:up .4s both}.cm p{margin:.2em 0}.ch{margin-left:12px}.act{display:flex;gap:6px}.act button{padding:2px 10px;font-size:.85rem}
.bg{background:var(--a2);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 8px;margin-left:6px;font-style:normal}
.au{display:flex;justify-content:center;padding:50px 20px}.box{background:var(--cd);border:1px solid var(--bd);border-radius:24px;padding:28px;width:100%;max-width:400px;box-shadow:var(--sh)}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:inherit;color:var(--mu);cursor:pointer;transition:.25s}.tabs .on{background:var(--ac);color:#fff}
.or{text-align:center;color:var(--mu);margin:16px 0 8px;font-size:.85rem}.soc{display:flex;gap:8px}.soc button{flex:1;padding:9px 4px;border:1px solid var(--bd);border-radius:10px;background:none;color:var(--tx);font:inherit;cursor:pointer;transition:.2s}.soc button:hover{border-color:var(--ac);transform:translateY(-2px)}.hint{display:block;margin-top:14px;color:var(--mu)}
.pn{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:8px 20px 18px;margin:16px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.row.col{flex-direction:column;align-items:stretch}.ra{display:flex;gap:6px;flex-wrap:wrap}.ra input{flex:1;min-width:140px;margin:0}
footer{border-top:1px solid var(--bd);margin-top:40px;background:var(--cd)}.fi{max-width:1080px;margin:auto;padding:30px 20px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;color:var(--mu)}.fi nav a{padding:2px 10px}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:99px;opacity:0;transition:.35s;pointer-events:none;z-index:20}#t.s{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}@keyframes fl{50%{transform:translateY(30px) scale(1.06)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:640px){.rb{flex-direction:column}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header><div class="hi"><a class="logo" href="#/"><svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="var(--ac)"/><path d="M8 24V14h5v10M14.5 24V8h5v16M21 24v-7h3v7" stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>City<b>-News</b></a><nav id="nav"></nav><div id="auth"></div><button class="ghost" onclick="th()" title="Тема">◐</button></div></header>
<main id="app"></main>
<footer><div class="fi"><div><a class="logo" href="#/">City<b>-News</b></a><p>Новости города — коротко, честно, по делу.</p></div><nav><a href="#/">Главная</a><a href="#/news">Новости</a><a href="#/login">Войти</a></nav><div>редакция@city-news.ru<br>© 2026 City-News</div></div></footer>
<div id="t"></div>
<script>
/* ===== НАСТРОЙКИ SUPABASE (Project Settings → API) ===== */
const SUPABASE_URL='https://ggxqequzlogcpsaubyyv.supabase.co',SUPABASE_KEY='sb_publishable_uyZVsqbVYhJSsZ-THf208w_WEqA6JEA';
/* ===== КОД САЙТА ===== */
const $=s=>document.querySelector(s);let sb,ME=null,P=[],C=[],R=[],PR=[],sort='new',mode='in';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
let tt;const toast=m=>{const e=$('#t');e.textContent=m;e.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('s'),3200)};
const th=()=>{const r=document.documentElement,d=matchMedia('(prefers-color-scheme:dark)').matches,c=r.dataset.theme||(d?'dark':'light');r.dataset.theme=c=='dark'?'light':'dark'};
const prof=id=>PR.find(p=>p.id==id),nm=id=>prof(id)?.name||'Удалён',isA=()=>prof(ME?.id)?.role=='admin';
const cnt=(p,v)=>R.filter(r=>r.post_id==p.id&&r.value==v).length,cc=p=>C.filter(c=>c.post_id==p.id).length,pop=p=>cnt(p,1)+cnt(p,-1)+cc(p);
const card=(p,i)=>`<a class="card" href="#/post/${p.id}" style="animation-delay:${i*70}ms"><span class="tag">${esc(p.category)}</span><h3>${esc(p.title)}</h3><p>${esc(p.body.split('\n\n')[0].slice(0,120))}…</p><div class="meta"><span>${fd(p.created_at)}</span><span>👍 ${cnt(p,1)} · 👎 ${cnt(p,-1)} · 💬 ${cc(p)}</span></div></a>`;
const byNew=(x,y)=>new Date(y.created_at)-new Date(x.created_at);
const empty=()=>`<p class="mu">Постов пока нет.${isA()?' Создайте первый в админ-панели.':''}</p>`;
function home(){const a=[...P].sort(byNew).slice(0,3);return`<section class="hero"><div class="blob"></div><h1>Город — <span class="gr">в одном ритме</span></h1><p>City-News — независимое издание о жизни города: транспорт, культура, экономика, спорт и события. Читайте, оценивайте и обсуждайте новости.</p><a class="btn" href="#/news">Читать новости</a></section><section class="w"><div class="f3"><div><span>⚡</span><h3>Быстро</h3><p class="mu">Главное за минуту, без воды.</p></div><div><span>💬</span><h3>Вместе</h3><p class="mu">Реакции и комментарии читателей.</p></div><div><span>🧭</span><h3>Честно</h3><p class="mu">Только проверенные факты.</p></div></div><div class="hd"><h2>Последние новости</h2><a class="mu" href="#/news">Все →</a></div><div class="grid">${a.map(card).join('')}</div>${a.length?'':empty()}</section>`}
function news(){const a=[...P].sort(sort=='new'?byNew:sort=='old'?(x,y)=>-byNew(x,y):(x,y)=>pop(y)-pop(x)),o=(v,t)=>`<option value="${v}"${sort==v?' selected':''}>${t}</option>`;return`<section class="w"><div class="hd"><h1>Новости</h1><select onchange="sort=this.value;go(1)">${o('new','Сначала новые')}${o('old','Сначала старые')}${o('pop','Сначала популярные')}</select></div><div class="grid">${a.map(card).join('')}</div>${a.length?'':empty()}</section>`}
const cm=(pid,par=null)=>C.filter(c=>c.post_id==pid&&(c.parent_id??null)==par).sort((a,b)=>a.created_at<b.created_at?-1:1).map(c=>`<div class="cm"><b>${esc(nm(c.user_id))}</b>${prof(c.user_id)?.role=='admin'?'<i class="bg">редакция</i>':''} <small class="mu">${fd(c.created_at)}</small><p>${esc(c.body)}</p><div class="act"><button onclick="tr(${c.id})">Ответить</button>${isA()||c.user_id==ME?.id?`<button class="dg" onclick="delC(${c.id})">Удалить</button>`:''}</div><div class="rb hide" id="rb${c.id}"><input id="r${c.id}" placeholder="Ваш ответ…"><button class="btn" onclick="addC(${pid},${c.id})">Отправить</button></div><div class="ch">${cm(pid,c.id)}</div></div>`).join('');
function post(id){const p=P.find(x=>x.id==id);if(!p)return'<section class="w"><h1>Пост не найден</h1><a href="#/news" class="mu">← Все новости</a></section>';const m=R.find(r=>r.post_id==p.id&&r.user_id==ME?.id)?.value;return`<article class="w art"><a href="#/news" class="mu">← Все новости</a><br><span class="tag">${esc(p.category)}</span><h1>${esc(p.title)}</h1><small class="mu">${fd(p.created_at)}</small><div class="body">${p.body.split('\n\n').map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="rx"><button class="${m==1?'on':''}" onclick="react(${p.id},1)">👍 ${cnt(p,1)}</button><button class="${m==-1?'on':''}" onclick="react(${p.id},-1)">👎 ${cnt(p,-1)}</button></div><h2>Комментарии (${cc(p)})</h2>${ME?`<div class="rb"><input id="nc" placeholder="Написать комментарий…"><button class="btn" onclick="addC(${p.id},0)">Отправить</button></div>`:'<p class="mu"><a href="#/login" style="color:var(--ac)">Войдите</a>, чтобы комментировать и оценивать.</p>'}<div>${cm(p.id)||'<p class="mu">Пока нет комментариев.</p>'}</div></article>`}
function login(){if(ME)return`<section class="au"><div class="box"><h2 style="margin-top:0">Вы вошли</h2><p>Вы вошли как <b>${esc(nm(ME.id))}</b>${isA()?' · администратор':''}.</p><button class="btn w" onclick="out()">Выйти</button></div></section>`;return`<section class="au"><div class="box"><div class="tabs"><button class="${mode=='in'?'on':''}" onclick="mode='in';go(1)">Вход</button><button class="${mode=='up'?'on':''}" onclick="mode='up';go(1)">Регистрация</button></div>${mode=='up'?'<input id="an" placeholder="Имя">':''}<input id="ae" type="email" placeholder="Почта"><input id="ap" type="password" placeholder="Пароль (от 6 символов)"><button class="btn w" onclick="auth()" style="margin-top:8px">${mode=='in'?'Войти':'Создать аккаунт'}</button><div class="or">или авторизируйтесь через:</div><div class="soc"><button onclick="soc('google')">Google</button></div></div></section>`}
function admin(){if(!isA())return'<section class="w"><h1>Доступ закрыт</h1><p class="mu">Админ-панель доступна только администраторам.</p></section>';return`<section class="w"><h1>Админ-панель</h1><div class="pn"><h2>Новый пост</h2><input id="pt" placeholder="Заголовок"><input id="pc" placeholder="Категория (Транспорт, Культура…)"><textarea id="pb" rows="6" placeholder="Текст новости (абзацы разделяйте пустой строкой)"></textarea><button class="btn" onclick="addP()">Опубликовать</button></div><div class="pn"><h2>Посты</h2>${P.sort(byNew).map(p=>`<div class="row"><a href="#/post/${p.id}">${esc(p.title)}</a><button class="dg" onclick="delP(${p.id})">Удалить</button></div>`).join('')||'<p class="mu">Постов нет</p>'}</div><div class="pn"><h2>Комментарии</h2>${C.map(c=>`<div class="row col"><div><b>${esc(nm(c.user_id))}</b> → <a href="#/post/${c.post_id}" class="mu">${esc(P.find(p=>p.id==c.post_id)?.title||'')}</a><p style="margin:.2em 0">${esc(c.body)}</p></div><div class="ra"><input id="a${c.id}" placeholder="Ответить…"><button class="btn" onclick="adR(${c.id})">Ответить</button><button class="dg" onclick="delC(${c.id})">Удалить</button></div></div>`).join('')||'<p class="mu">Комментариев нет</p>'}</div><div class="pn"><h2>Пользователи</h2>${PR.filter(u=>u.role!='admin').map(u=>`<div class="row"><span>${esc(u.name)}</span><button class="dg" onclick="delU('${u.id}')">Удалить аккаунт</button></div>`).join('')||'<p class="mu">Пользователей нет</p>'}</div></section>`}
function go(keep){const[,r,a]=(location.hash.slice(1)||'/').split('/'),h=location.hash||'#/',l=[['#/','Главная'],['#/news','Новости']];if(isA())l.push(['#/admin','Админ']);$('#app').innerHTML=r=='news'?news():r=='post'?post(a):r=='login'?login():r=='admin'?admin():home();$('#nav').innerHTML=l.map(([u,t])=>`<a href="${u}" class="${h==u?'on':''}">${t}</a>`).join('');$('#auth').innerHTML=ME?`<span class="mu">${esc(nm(ME.id))}</span><button class="ghost" onclick="out()">Выйти</button>`:'<a class="btn" href="#/login">Войти</a>';if(!keep)scrollTo(0,0)}
async function load(){const q=t=>sb.from(t).select('*'),[a,b,c,d]=await Promise.all([q('posts'),q('comments'),q('reactions'),q('profiles')]);if(a.error)toast('Ошибка базы: '+a.error.message);P=a.data||[];C=b.data||[];R=c.data||[];PR=d.data||[]}
async function run(q){const{error}=await q;if(error){toast(error.message);return 0}await load();go(1);return 1}
const need=()=>{if(ME)return 1;toast('Сначала войдите в аккаунт');location.hash='/login'};
function react(pid,v){if(!need())return;const m=R.find(r=>r.post_id==pid&&r.user_id==ME.id);run(m?.value==v?sb.from('reactions').delete().match({post_id:pid,user_id:ME.id}):sb.from('reactions').upsert({post_id:pid,user_id:ME.id,value:v}))}
function addC(pid,par){if(!need())return;const v=$(par?'#r'+par:'#nc').value.trim();if(v)run(sb.from('comments').insert({post_id:pid,parent_id:par||null,user_id:ME.id,body:v}))}
function tr(id){if(need())$('#rb'+id).classList.toggle('hide')}
const delC=id=>run(sb.from('comments').delete().eq('id',id)),delP=id=>run(sb.from('posts').delete().eq('id',id)),delU=id=>run(sb.rpc('admin_delete_user',{uid:id}));
function addP(){const t=$('#pt').value.trim(),b=$('#pb').value.trim();if(!t||!b)return toast('Заполните заголовок и текст');run(sb.from('posts').insert({title:t,category:$('#pc').value.trim()||'Город',body:b})).then(ok=>ok&&toast('Пост опубликован'))}
function adR(id){const v=$('#a'+id).value.trim(),c=C.find(x=>x.id==id);if(v)run(sb.from('comments').insert({post_id:c.post_id,parent_id:id,user_id:ME.id,body:v}))}
async function auth(){const e=$('#ae').value.trim(),p=$('#ap').value;if(!e||p.length<6)return toast('Введите почту и пароль (от 6 символов)');
if(mode=='in'){const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)return toast(error.message);location.hash='/'}
else{const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{name:$('#an').value.trim()}}});if(error)return toast(error.message);if(data.session)location.hash='/';else toast('Проверьте почту и подтвердите адрес')}}
const soc=p=>sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.href.split('#')[0]}});
const out=async()=>{await sb.auth.signOut();location.hash='/'};
(async()=>{if(SUPABASE_URL.includes('ВАШ')){$('#app').innerHTML='<section class="w"><h1>Настройте Supabase</h1><p class="mu">Впишите URL проекта и ключ anon в начале файла index.html (см. README.md).</p></section>';return}
sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);ME=(await sb.auth.getSession()).data.session?.user||null;await load();go();
sb.auth.onAuthStateChange((ev,s)=>{if(ev=='INITIAL_SESSION')return;ME=s?.user||null;load().then(()=>go(1))});
addEventListener('hashchange',()=>go())})();
</script></body></html>
